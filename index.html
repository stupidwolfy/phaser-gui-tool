<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable stop the browser from double-tap-zooming the
         whole editor when you are trying to zoom the Phaser camera. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15171c" />
    <!-- Inlined so the tab icon costs no request and can't 404 under a base path. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171a21'/%3E%3Cpath d='M16 6l8 10-8 10-8-10z' fill='%234f8cff'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="A browser-based visual editor for the Phaser game framework. Runs entirely on your device."
    />
    <title>Phaser GUI Tool</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
