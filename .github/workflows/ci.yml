name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same branch has nothing left to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only: the suite's canvas assertions are written against it,
      # and it is what the editor is developed and verified in.
      - run: npx playwright install --with-deps chromium

      # `npm test` builds the app itself — the suite drives the production
      # build, not the dev server — so this is only the type gate.
      - run: npm run typecheck

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
